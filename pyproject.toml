[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-gated-mcp"
version = "0.1.0"
description = "Tool-poisoning red-team + provenance/OPA policy defense for MCP-style agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Antares" }]
keywords = ["mcp", "prompt-injection", "opa", "rego", "provenance", "ai-security"]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas>=2.2",
]
# Optional real-model adapters. Disabled by default; never required for tests/eval.
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.3"]
# Interactive Streamlit demo (see demo/app.py); not required for tests/eval.
demo = ["streamlit>=1.35", "pandas>=2.2"]

[project.scripts]
policy-gated-mcp = "policy_gated_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_gated_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "opa: tests that require the `opa` binary on PATH (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `str, Enum` is the intended idiom here (stable pydantic/JSON serialization); we do
# not want StrEnum's differing str() semantics.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Typer requires `typer.Option()/Argument()` calls in parameter defaults (B008).
"src/policy_gated_mcp/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["policy_gated_mcp"]
strict = false
ignore_missing_imports = true
